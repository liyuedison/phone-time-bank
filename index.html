<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>薪火传承｜现场成交动态</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="control-panel" aria-label="后台录入">
        <div class="brand-row">
          <div>
            <p class="eyebrow">薪火传承</p>
            <h1>现场成交动态</h1>
          </div>
          <button class="icon-button" id="resetData" type="button" title="恢复示例">
            <span aria-hidden="true">↺</span>
          </button>
        </div>

        <form class="entry-form" id="entryForm">
          <label>
            <span>地区</span>
            <input id="region" name="region" type="text" placeholder="如：杭州" required />
          </label>
          <label>
            <span>时间</span>
            <input id="time" name="time" type="text" placeholder="如：刚刚 / 14:28" required />
          </label>
          <label>
            <span>姓名</span>
            <input id="name" name="name" type="text" placeholder="如：李先生" required />
          </label>
          <label>
            <span>手机号</span>
            <input id="phone" name="phone" type="tel" placeholder="如：138****8899" required />
          </label>
          <label>
            <span>成交单数</span>
            <input id="orders" name="orders" type="number" min="1" value="1" required />
          </label>
          <label>
            <span>备注</span>
            <input id="note" name="note" type="text" placeholder="如：已确认付款" />
          </label>
          <button class="primary-button" type="submit">添加真实记录</button>
        </form>

        <div class="toolbar">
          <label class="switch">
            <input id="showVerified" type="checkbox" checked />
            <span>显示“真实成交”标识</span>
          </label>
          <label class="switch">
            <input id="fastMode" type="checkbox" />
            <span>加快滚动</span>
          </label>
        </div>

        <div class="records-head">
          <h2>已录入记录</h2>
          <button class="text-button" id="clearRecords" type="button">清空</button>
        </div>
        <div class="record-list" id="recordList"></div>
      </section>

      <section class="live-screen" aria-label="前台滚动展示">
        <div class="screen-top">
          <div>
            <p class="eyebrow light">现场实时动态</p>
            <h2>薪火传承成交播报</h2>
          </div>
          <div class="counter">
            <span id="totalOrders">0</span>
            <small>累计成交单</small>
          </div>
        </div>

        <div class="hero-strip">
          <div>
            <strong>真实报名与成交信息实时同步</strong>
            <span>隐私信息已脱敏展示</span>
          </div>
        </div>

        <div class="ticker-wrap">
          <div class="ticker" id="ticker"></div>
        </div>

        <div class="stats-row">
          <div>
            <span id="cityCount">0</span>
            <small>覆盖地区</small>
          </div>
          <div>
            <span id="buyerCount">0</span>
            <small>成交客户</small>
          </div>
          <div>
            <span id="latestTime">--</span>
            <small>最新成交</small>
          </div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
